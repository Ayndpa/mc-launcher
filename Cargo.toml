[package]
name = "mc_launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = true }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
zip = "2"

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"
